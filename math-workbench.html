<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MATH-ENGINE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef, useCallback, useMemo } = React;
const rad = d => d * Math.PI / 180;
const deg = r => r * 180 / Math.PI;
const norm = d => ((d % 360) + 360) % 360;
const f = (x, n = 3) => (Math.abs(x) < 5e-4 ? 0 : x).toFixed(n).replace('-', '−');

/* Перетаскивание: переводит координаты указателя в координаты SVG */
function useDrag(svgRef, onMove) {
  return useCallback(e => {
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    const move = ev => {
      pt.x = ev.clientX; pt.y = ev.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      onMove(p.x, p.y);
    };
    e.preventDefault(); move(e);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', () => window.removeEventListener('pointermove', move), { once: true });
  }, [onMove]);
}

/* ---------- Инструмент: тригонометрический круг ---------- */
function UnitCircle({ st }) {
  const { theta, setTheta, snap } = st;
  const ref = useRef();
  const C = 220, R = 160;
  const drag = useDrag(ref, (x, y) => {
    let a = norm(deg(Math.atan2(C - y, x - C)));
    if (snap) a = Math.round(a / 15) * 15 % 360;
    setTheta(a);
  });
  const t = rad(theta), px = C + R * Math.cos(t), py = C - R * Math.sin(t);
  const tanY = C - R * Math.tan(t);
  const tanOk = Math.abs(Math.tan(t)) < 2.2;
  const arc = `M${C + 36},${C} A36,36 0 ${theta > 180 ? 1 : 0} 0 ${C + 36 * Math.cos(t)},${C - 36 * Math.sin(t)}`;
  return (
    <svg ref={ref} viewBox="0 0 440 440" role="img" aria-label="Тригонометрический круг">
      {[...Array(9)].map((_, i) => <g key={i}>
        <line x1={20 + i * 50} y1="20" x2={20 + i * 50} y2="420" stroke="var(--grid)" />
        <line x1="20" y1={20 + i * 50} x2="420" y2={20 + i * 50} stroke="var(--grid)" />
      </g>)}
      <line x1="20" y1={C} x2="420" y2={C} stroke="var(--soft)" />
      <line x1={C} y1="20" x2={C} y2="420" stroke="var(--soft)" />
      <circle cx={C} cy={C} r={R} fill="none" stroke="var(--ink)" strokeWidth="1.5" />
      {[0, 30, 45, 60, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330].map(a => {
        const x = C + R * Math.cos(rad(a)), y = C - R * Math.sin(rad(a));
        return <g key={a}><circle cx={x} cy={y} r="2.5" fill="var(--soft)" />
          <text x={C + (R + 20) * Math.cos(rad(a))} y={C - (R + 20) * Math.sin(rad(a)) + 4} fontSize="10" textAnchor="middle" fill="var(--soft)">{a}°</text></g>;
      })}
      {tanOk && <>
        <line x1={C + R} y1={C} x2={C + R} y2={tanY} stroke="var(--tan)" strokeWidth="3" />
        <line x1={C} y1={C} x2={C + R} y2={tanY} stroke="var(--tan)" strokeDasharray="3 3" />
      </>}
      <line x1={C} y1={C} x2={px} y2={C} stroke="var(--cos)" strokeWidth="3" />
      <line x1={px} y1={C} x2={px} y2={py} stroke="var(--sin)" strokeWidth="3" />
      <line x1={C} y1={C} x2={px} y2={py} stroke="var(--acc)" strokeWidth="2" />
      <path d={arc} fill="none" stroke="var(--acc)" strokeWidth="2" />
      <circle className="handle" onPointerDown={drag} cx={px} cy={py} r="9" fill="var(--acc)" stroke="var(--panel)" strokeWidth="3" tabIndex="0"
        onKeyDown={e => { if (e.key === 'ArrowLeft') setTheta(norm(theta + 1)); if (e.key === 'ArrowRight') setTheta(norm(theta - 1)); }} />
    </svg>
  );
}

/* ---------- Инструмент: графики sin, cos, tg, ctg на осях Ox / Oy ---------- */
function Graph({ st }) {
  const { theta, setTheta, snap, shiftX, shiftY, fn, setFn } = st;
  const ref = useRef();
  const W = 720, H = 360, cx = W / 2, cy = H / 2, kx = 0.9, ky = 50, YM = 3.2;
  const X = d => cx + kx * d;
  const Y = v => cy - ky * v;
  const clampV = v => Math.max(-10, Math.min(10, v));
  const base = {
    sin: d => Math.sin(rad(d - shiftX)),
    cos: d => Math.cos(rad(d - shiftX)),
    tan: d => Math.sin(rad(d - shiftX)) / Math.cos(rad(d - shiftX)),
    cot: d => Math.cos(rad(d - shiftX)) / Math.sin(rad(d - shiftX)),
  };
  const colors = { sin: 'var(--sin)', cos: 'var(--cos)', tan: 'var(--tan)', cot: 'var(--cot, #8b5cf6)' };
  /* путь обрывается на разрывах (асимптотах) тангенса и котангенса */
  const curve = (g, step) => {
    let p = '', prev = null;
    for (let d = -360; d <= 360; d += step) {
      const v = g(d);
      if (!isFinite(v)) { prev = null; continue; }
      const jump = prev !== null && Math.sign(prev) !== Math.sign(v) && Math.abs(prev) + Math.abs(v) > 8;
      p += `${prev === null || jump ? 'M' : 'L'}${X(d).toFixed(1)},${Y(clampV(v) + shiftY).toFixed(1)}`;
      prev = v;
    }
    return p;
  };
  const paths = useMemo(() => ({
    sin: curve(base.sin, 1), cos: curve(base.cos, 1), tan: curve(base.tan, .5), cot: curve(base.cot, .5),
  }), [shiftX, shiftY]);
  const drag = useDrag(ref, x => {
    let d = Math.min(360, Math.max(-360, (x - cx) / kx));
    setTheta(norm(snap ? Math.round(d / 15) * 15 : d));
  });
  const halo = { paintOrder: 'stroke' };
  const xTicks = [-360, -270, -180, -90, 90, 180, 270, 360];
  const yTicks = [-3, -2, -1, 1, 2, 3];
  const asym = [];
  for (let n = -4; n <= 4; n++) {
    if (fn.tan) asym.push({ d: 90 + shiftX + 180 * n, c: colors.tan, k: 't' + n });
    if (fn.cot) asym.push({ d: shiftX + 180 * n, c: colors.cot, k: 'c' + n });
  }
  const marks = [theta, theta - 360];
  return (
    <svg ref={ref} viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Графики синуса, косинуса, тангенса и котангенса" onPointerDown={drag}>
      <defs>
        <clipPath id="plot"><rect x="20" y={Y(YM)} width={W - 40} height={ky * 2 * YM} /></clipPath>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="var(--ink)" />
        </marker>
      </defs>

      {/* сетка */}
      {xTicks.map(d => <line key={d} x1={X(d)} y1={Y(YM)} x2={X(d)} y2={Y(-YM)} stroke="var(--grid)" />)}
      {yTicks.map(v => <line key={v} x1="20" y1={Y(v)} x2={W - 20} y2={Y(v)} stroke="var(--grid)" />)}

      {/* асимптоты tg / ctg */}
      <g clipPath="url(#plot)">
        {asym.map(a => <line key={a.k} x1={X(a.d)} y1={Y(YM)} x2={X(a.d)} y2={Y(-YM)} stroke={a.c} strokeOpacity=".45" strokeDasharray="5 4" />)}
      </g>

      {/* оси Ox и Oy */}
      <line x1="14" y1={cy} x2={W - 12} y2={cy} stroke="var(--ink)" strokeWidth="1.6" markerEnd="url(#arr)" />
      <line x1={cx} y1={H - 10} x2={cx} y2="12" stroke="var(--ink)" strokeWidth="1.6" markerEnd="url(#arr)" />
      <text x={W - 10} y={cy - 10} fontSize="14" fontStyle="italic" textAnchor="end" fill="var(--ink)">x</text>
      <text x={cx + 10} y="18" fontSize="14" fontStyle="italic" fill="var(--ink)">y</text>
      <text x={cx - 8} y={cy + 15} fontSize="11" textAnchor="end" fill="var(--soft)">O</text>

      {/* деления */}
      {xTicks.map(d => <g key={d}>
        <line x1={X(d)} y1={cy - 4} x2={X(d)} y2={cy + 4} stroke="var(--ink)" />
        <text x={X(d)} y={cy + 17} fontSize="10" textAnchor="middle" fill="var(--soft)" stroke="var(--panel)" strokeWidth="3" style={halo}>{d}°</text></g>)}
      {yTicks.map(v => <g key={v}>
        <line x1={cx - 4} y1={Y(v)} x2={cx + 4} y2={Y(v)} stroke="var(--ink)" />
        <text x={cx - 9} y={Y(v) + 4} fontSize="10" textAnchor="end" fill="var(--soft)" stroke="var(--panel)" strokeWidth="3" style={halo}>{f(v, 0)}</text></g>)}

      {/* кривые */}
      <g clipPath="url(#plot)" fill="none" strokeWidth="2.5" strokeLinejoin="round">
        {['sin', 'cos', 'tan', 'cot'].filter(k => fn[k]).map(k => <path key={k} d={paths[k]} stroke={colors[k]} />)}
      </g>

      {/* маркер угла и точки на кривых */}
      {marks.map((m, i) => <g key={i} opacity={i ? .35 : 1}>
        <line x1={X(m)} y1={Y(YM)} x2={X(m)} y2={Y(-YM)} stroke="var(--acc)" strokeWidth="1.5" />
        {['sin', 'cos', 'tan', 'cot'].filter(k => fn[k]).map(k => {
          const v = base[k](m) + shiftY;
          return isFinite(v) && Math.abs(v) <= YM ? <circle key={k} cx={X(m)} cy={Y(v)} r="5.5" fill={colors[k]} stroke="var(--panel)" strokeWidth="2" /> : null;
        })}
      </g>)}

      {/* легенда: клик включает/выключает функцию */}
      {[['sin', 'sin'], ['cos', 'cos'], ['tan', 'tg'], ['cot', 'ctg']].map(([k, n], i) =>
        <g key={k} style={{ cursor: 'pointer' }} opacity={fn[k] ? 1 : .4}
           onPointerDown={e => { e.stopPropagation(); setFn({ ...fn, [k]: !fn[k] }); }}>
          <rect x={W - 80} y={22 + i * 20} width="64" height="18" fill="transparent" />
          <text x={W - 26} y={36 + i * 20} fontSize="12" textAnchor="end" fill={colors[k]}
                stroke="var(--panel)" strokeWidth="3" style={halo}>{n}</text>
        </g>)}
    </svg>
  );
}

/* ---------- Инструмент: единичная сфера (3D) ---------- */
function Sphere({ st }) {
  const { theta, psi } = st;
  const [view, setView] = useState({ yaw: 35, pitch: 22 });
  const C = 220, R = 150;
  const a = rad(view.yaw), b = rad(view.pitch);
  /* мир: x вправо, y вглубь, z вверх → экран (ортографическая проекция) */
  const P = ([x, y, z]) => {
    const x1 = x * Math.cos(a) - y * Math.sin(a);
    const y1 = x * Math.sin(a) + y * Math.cos(a);
    return [C + R * x1, C - R * (z * Math.cos(b) + y1 * Math.sin(b))];
  };
  const path = pts => pts.map((p, i) => { const q = P(p); return `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`; }).join('');
  const ring = fn => path([...Array(73)].map((_, i) => fn(rad(i * 5))));
  const t = rad(theta), s = rad(psi);
  const pt = [Math.cos(s) * Math.cos(t), Math.cos(s) * Math.sin(t), Math.sin(s)];
  const q = [pt[0], pt[1], 0];
  const O = P([0, 0, 0]), Pp = P(pt), Qp = P(q);
  const line = (A, B, props) => <line x1={A[0]} y1={A[1]} x2={B[0]} y2={B[1]} {...props} />;
  /* дуга θ в плоскости xy */
  const arcT = path([...Array(Math.max(2, Math.round(theta / 5) + 1))].map((_, i) => {
    const u = rad(Math.min(theta, i * 5));
    return [.25 * Math.cos(u), .25 * Math.sin(u), 0];
  }));
  /* дуга ψ в вертикальной плоскости точки */
  const arcS = path([...Array(Math.max(2, Math.round(Math.abs(psi) / 5) + 1))].map((_, i) => {
    const u = rad(Math.sign(psi) * Math.min(Math.abs(psi), i * 5));
    return [.3 * Math.cos(u) * Math.cos(t), .3 * Math.cos(u) * Math.sin(t), .3 * Math.sin(u)];
  }));
  const down = e => {
    const sx = e.clientX, sy = e.clientY, v0 = view;
    e.preventDefault();
    const move = ev => setView({
      yaw: v0.yaw + (ev.clientX - sx) * .5,
      pitch: Math.max(-89, Math.min(89, v0.pitch + (ev.clientY - sy) * .5)),
    });
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', () => window.removeEventListener('pointermove', move), { once: true });
  };
  const axes = [['x', [1.3, 0, 0]], ['y', [0, 1.3, 0]], ['z', [0, 0, 1.3]]];
  return (
    <svg viewBox="0 0 440 440" role="img" aria-label="Единичная сфера в 3D" onPointerDown={down} style={{ cursor: 'grab' }}>
      {/* контуры сферы: экватор и два меридиана */}
      <path d={ring(u => [Math.cos(u), Math.sin(u), 0])} fill="none" stroke="var(--ink)" strokeWidth="1.5" />
      <path d={ring(u => [Math.cos(u), 0, Math.sin(u)])} fill="none" stroke="var(--grid)" strokeWidth="1.5" />
      <path d={ring(u => [0, Math.cos(u), Math.sin(u)])} fill="none" stroke="var(--grid)" strokeWidth="1.5" />
      {/* меридиан выбранной точки */}
      <path d={ring(u => [Math.cos(t) * Math.cos(u), Math.sin(t) * Math.cos(u), Math.sin(u)])}
        fill="none" stroke="var(--acc)" strokeOpacity=".45" strokeDasharray="4 3" />
      {/* оси */}
      {axes.map(([n, v]) => <g key={n}>
        {line(O, P(v), { stroke: 'var(--soft)' })}
        <text x={P(v)[0] + 6} y={P(v)[1] + 4} fontSize="13" fontStyle="italic" fill="var(--ink)">{n}</text>
      </g>)}
      {/* проекции: cos ψ — в плоскости xy, sin ψ — вертикаль */}
      {line(O, Qp, { stroke: 'var(--cos)', strokeWidth: 3 })}
      {line(Qp, Pp, { stroke: 'var(--sin)', strokeWidth: 3 })}
      {line(O, Pp, { stroke: 'var(--acc)', strokeWidth: 2 })}
      <path d={arcT} fill="none" stroke="var(--acc)" strokeWidth="2" />
      <path d={arcS} fill="none" stroke="var(--acc)" strokeWidth="2" />
      <circle cx={Pp[0]} cy={Pp[1]} r="8" fill="var(--acc)" stroke="var(--panel)" strokeWidth="3" />
      <text x="14" y="426" fontSize="11" fill="var(--soft)">Тяни, чтобы вращать</text>
    </svg>
  );
}

/* ---------- Панель свойств ---------- */
function Props({ tool, st }) {
  const { theta, setTheta, psi, setPsi, unit, setUnit, snap, setSnap, shiftX, setShiftX, shiftY, setShiftY, fn, setFn } = st;
  const val = v => Math.abs(v) > 1e6 || !isFinite(v) ? '∞' : f(v);
  const t = rad(theta), tan = Math.tan(t);
  const shown = unit === 'deg' ? theta : t;
  return <>
    <>
      <h2>Угол</h2>
      <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
        <input type="number" step={unit === 'deg' ? 1 : .01} value={+shown.toFixed(3)}
          onChange={e => setTheta(norm(unit === 'deg' ? +e.target.value : deg(+e.target.value)))} aria-label="Значение угла" />
        <button className="btn">°</button>
        <button className="btn" aria-pressed={unit === 'rad'} onClick={() => setUnit('rad')}>рад</button>
      </div>
      <label className="chk"><input type="checkbox" checked={snap} onChange={e => setSnap(e.target.checked)} /> Шаг 15°</label>
      <h2>Значения</h2>
      <div className="row"><span style={{ color: 'var(--sin)' }}>sin θ</span><b>{f(Math.sin(t))}</b></div>
      <div className="row"><span style={{ color: 'var(--cos)' }}>cos θ</span><b>{f(Math.cos(t))}</b></div>
      <div className="row"><span style={{ color: 'var(--tan)' }}>tg θ</span><b>{Math.abs(tan) > 1e6 ? '∞' : f(tan)}</b></div>
      <h2>Быстрый выбор</h2>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
        {[0, 30, 45, 60, 90, 180, 270].map(a => <button key={a} className="btn" onClick={() => setTheta(a)}>{a}°</button>)}
      </div>
      {tool.id === 'sphere' && <>
        <h2>Угол места ψ</h2>
        <label className="chk" style={{ display: 'block' }}>
          ψ: <b>{f(psi, 0)}°</b>
          <input type="range" min="-90" max="90" step={snap ? 15 : 1} value={psi}
            onChange={e => setPsi(+e.target.value)} style={{ width: '100%' }} aria-label="Угол места" />
        </label>
        <h2>Координаты точки</h2>
        <div className="row"><span style={{ color: 'var(--cos)' }}>x = cos ψ cos θ</span><b>{f(Math.cos(rad(psi)) * Math.cos(t))}</b></div>
        <div className="row"><span>y = cos ψ sin θ</span><b>{f(Math.cos(rad(psi)) * Math.sin(t))}</b></div>
        <div className="row"><span style={{ color: 'var(--sin)' }}>z = sin ψ</span><b>{f(Math.sin(rad(psi)))}</b></div>
      </>}
      {tool.id === 'graph' && <>
        <h2>Функции</h2>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 12, marginBottom: 8 }}>
          {[['sin', 'sin', 'var(--sin)'], ['cos', 'cos', 'var(--cos)'], ['tan', 'tg', 'var(--tan)'], ['cot', 'ctg', 'var(--cot, #8b5cf6)']].map(([k, n, c]) =>
            <label key={k} className="chk" style={{ color: c }}>
              <input type="checkbox" checked={fn[k]} onChange={e => setFn({ ...fn, [k]: e.target.checked })} /> {n}
            </label>)}
        </div>
        <h2>Сдвиги графика</h2>
        <label className="chk" style={{ display: 'block' }}>
          По горизонтали φ: <b>{f(shiftX, 0)}°</b>
          <input type="range" min="-180" max="180" step={snap ? 15 : 1} value={shiftX}
            onChange={e => setShiftX(+e.target.value)} style={{ width: '100%' }} aria-label="Горизонтальный сдвиг" />
        </label>
        <label className="chk" style={{ display: 'block', marginTop: 8 }}>
          По вертикали d: <b>{f(shiftY, 2)}</b>
          <input type="range" min="-1" max="1" step="0.05" value={shiftY}
            onChange={e => setShiftY(+e.target.value)} style={{ width: '100%' }} aria-label="Вертикальный сдвиг" />
        </label>
        <div className="row"><span style={{ color: 'var(--sin)' }}>sin(θ − φ) + d</span><b>{val(Math.sin(rad(theta - shiftX)) + shiftY)}</b></div>
        <div className="row"><span style={{ color: 'var(--cos)' }}>cos(θ − φ) + d</span><b>{val(Math.cos(rad(theta - shiftX)) + shiftY)}</b></div>
        <div className="row"><span style={{ color: 'var(--tan)' }}>tg(θ − φ) + d</span><b>{val(Math.tan(rad(theta - shiftX)) + shiftY)}</b></div>
        <div className="row"><span style={{ color: 'var(--cot, #8b5cf6)' }}>ctg(θ − φ) + d</span><b>{val(1 / Math.tan(rad(theta - shiftX)) + shiftY)}</b></div>
        <button className="btn" onClick={() => { setShiftX(0); setShiftY(0); }}>Сбросить сдвиги</button>
      </>}
    </>
  </>;
}

/* ---------- Реестр инструментов: сюда добавляются новые объекты ---------- */
const TOOLS = [
  { id: 'circle', name: 'Тригонометрический круг', hint: 'sin, cos, tg', Comp: UnitCircle },
  { id: 'graph', name: 'Графики sin, cos, tg, ctg', hint: 'связаны с кругом', Comp: Graph },
  { id: 'sphere', name: 'Единичная сфера (3D)', hint: 'углы θ и ψ', Comp: Sphere },
];

function App() {
  const [toolId, setToolId] = useState('circle');
  const [theta, setTheta] = useState(40);
  const [psi, setPsi] = useState(30);
  const [unit, setUnit] = useState('deg');
  const [snap, setSnap] = useState(false);
  const [shiftX, setShiftX] = useState(0);
  const [shiftY, setShiftY] = useState(0);
  const [fn, setFn] = useState({ sin: true, cos: false, tan: false, cot: false });
  const [theme, setTheme] = useState(null);
  const st = { theta, setTheta, psi, setPsi, unit, setUnit, snap, setSnap, shiftX, setShiftX, shiftY, setShiftY, fn, setFn };
  const tool = TOOLS.find(t => t.id === toolId);
  const toggleTheme = () => {
    const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    setTheme(next); document.documentElement.dataset.theme = next;
  };
  return (
    <div className="app">
      <header className="top">
        <h1>MATH-ENGINE</h1>
        <button className="btn" onClick={toggleTheme}>Тема</button>
      </header>
      <nav className="side" aria-label="Инструменты">
        {TOOLS.map(t => <button key={t.id} className="tool" aria-current={t.id === toolId} onClick={() => setToolId(t.id)}>
          {t.name}<small>{t.hint}</small></button>)}
      </nav>
      <main className="stage"><tool.Comp st={st} /></main>
      <aside className="props" aria-label="Свойства"><Props tool={tool} st={st} /></aside>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
